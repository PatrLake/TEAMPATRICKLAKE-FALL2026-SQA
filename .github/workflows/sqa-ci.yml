name: SQA Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sqa-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruamel.yaml pandas numpy sarif-om jschema-to-python

      - name: Verify Python syntax across project
        run: |
          python -m py_compile fuzz.py slikube/KubeSec-master/*.py

      - name: Run fuzzing suite
        run: python fuzz.py

      - name: Upload fuzzing log artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results-log
          path: fuzz_results.log